name: Contribs

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  contribs:
    runs-on: ubuntu-24.04
    name: Contribs
    if: ${{ github.repository == 'nrfconnect/sdk-hid' }}
    steps:
      - name: Contribs
        uses: carlescufi/action-contribs@d139e12dabbe631fcc94ec3e19e386a11d3e1a26 # main
        with:
          github-token: ${{ secrets.NCS_GITHUB_TOKEN }}
          command: 'external'
          messages: |
                    Thank you for your contribution!
                    It seems you are not a member of the nrfconnect GitHub organization. External contributions are handled as follows:
                    Large contributions, affecting multiple subsystems for example, may be rejected if they are complex, may introduce regressions due to lack of test coverage, or if they are not consistent with the architecture of the nRF Connect SDK HID add-on.
                    PRs will be run in our GitHub Actions CI workflows.
                    Documentation previews for external contributions are published once a reviewer adds the CI-trusted-author label.
                    If CI passes, PRs will be tagged for review and merged on successful completion of review. You may be asked to make some modifications to your contribution during review.
                    If CI fails, PRs may be rejected or may be tagged for review and rework.
                    PRs that become outdated due to other changes in the repository may be rejected or rework requested.
                    External contributions will be prioritized for review based on the relevance to current development efforts in the nRF Connect SDK HID add-on. Bug fix PRs will be prioritized.
                    You may raise issues or ask for help from our Technical Support team by visiting https://devzone.nordicsemi.com/.
          labels: 'external'
